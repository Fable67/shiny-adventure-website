name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      submodule-changed: ${{ steps.check-submodule.outputs.changed }}
    steps:
      - name: Checkout website repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update submodule to latest upstream commit
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git submodule update --remote data/shiny-adventure

      - name: Check if submodule changed
        id: check-submodule
        run: |
          if git diff --quiet -- data/shiny-adventure; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build site
        run: |
          python3 build.py --out dist

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Commit and push submodule pointer update
        if: github.event_name == 'schedule' && steps.check-submodule.outputs.changed == 'true'
        run: |
          SUBMODULE_SHA=$(git -C data/shiny-adventure rev-parse --short HEAD)
          git add data/shiny-adventure
          git commit -m "chore: sync shiny-adventure submodule to ${SUBMODULE_SHA}"
          git push || echo "::warning::failed to push submodule pointer update — check repo Settings > Actions > General > Workflow permissions is set to Read and write"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
